{% extends "officer_module/officer_dashboard.html" %}
{% load static %}

{% block title %}Add Rescue Team{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow">

    <h2 class="text-2xl font-bold text-green-700 mb-6">
        Add Rescue Team
    </h2>
      {% include 'includes/_messages.html' %}

    <form method="POST">
        {% csrf_token %}

        <!-- Team Name -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">
                Team Name
            </label>
            <input type="text"
                   name="team_name"
                   required
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <!-- Leader Name -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">
                Leader Name
            </label>
            <input type="text"
                   name="leader_name"
                   required
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <!-- Contact Number -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">
                Contact Number
            </label>
            <input type="text"
                   name="contact_number"
                   maxlength="15"
                   required
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <!-- Members Count -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">
                Number of Members
            </label>
            <input type="number"
                   name="members_count"
                   min="0"
                   value="0"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <!-- Notes -->
        <div class="mb-5">
            <label class="block text-gray-700 font-semibold mb-1">
                Notes (Optional)
            </label>
            <textarea name="notes"
                      rows="4"
                      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                      placeholder="Special skills, vehicle details, availability, etc."></textarea>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-3">
            <a href="{% url 'forest_dashboard' %}"
               class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300">
                Cancel
            </a>

            <button type="submit"
                    class="bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700">
                Save Rescue Team
            </button>
        </div>

    </form>

</div>
{% endblock %}
